name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes come from the annotated tag, which a shallow
          # checkout does not fetch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          echo "npm $(npm --version), package version $version"
          # `npm view` can exit 0 for a missing version, so compare the output
          # instead of trusting the exit code.
          published=$(npm view "opencode-tweaks@$version" version 2>/dev/null || true)
          echo "registry version: ${published:-<missing>}"
          if [ "$published" = "$version" ]; then
            echo "opencode-tweaks@$version is already published"
          else
            npm publish --provenance
          fi
      - name: Create or update the GitHub release
        run: |
          tag="${{ github.ref_name }}"
          # actions/checkout rewrites the tag ref to point at the commit, which
          # drops the annotation. Fetch it back before reading the notes.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
