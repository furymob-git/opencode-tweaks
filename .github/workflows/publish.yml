name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm publish
      - name: Create the GitHub release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-from-tag --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
